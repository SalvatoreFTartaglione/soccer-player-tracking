name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Only the light dependencies: the tests do not need torch / ultralytics / boxmot.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26,<2" pandas scipy pyyaml opencv-python-headless matplotlib pytest ruff
          pip install git+https://github.com/JonathonLuiten/TrackEval.git
      - name: Lint
        run: ruff check soccer_tracker tests
      - name: Test
        run: pytest -q
